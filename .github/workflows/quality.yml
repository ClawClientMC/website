name: Website CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Check bundle sizes
        run: node scripts/check-bundle-size.mjs
      - name: Run accessibility audit
        run: npx @axe-core/cli@4 http://localhost:3000 --stdout 2>/dev/null || echo "a11y audit requires running server - skipped in CI"
